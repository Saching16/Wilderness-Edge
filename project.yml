name: WildernessEdge
options:
  bundleIdPrefix: com.wildernessedge
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
# LiteRT-LM SPM is added in Phase 3 (LLMInferenceManager). Declaring it here would
# force native LLM linkage during Phase 1 audio/safety verification builds.
# Package URL when wiring Phase 3: https://github.com/google-ai-edge/LiteRT-LM (product: LiteRTLM, from: 0.12.0)
targets:
  WildernessEdge:
    type: application
    platform: iOS
    sources:
      - path: WildernessEdge
        excludes:
          - Resources/**
      - path: WildernessEdge/Resources
        type: folder
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wildernessedge.app
        PRODUCT_NAME: WildernessEdge
        INFOPLIST_FILE: WildernessEdge/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: WildernessEdge/App/WildernessEdge.entitlements
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
    # macOS Sequoia+ stamps com.apple.provenance on copied resources; ad-hoc codesign
    # then mis-detects Assets.car / PNGs as nested code objects. Rewrite bytes in-place
    # (no xattrs) in a postbuild script so it runs after Copy Bundle Resources / actool.
    postbuildScripts:
      - name: Strip Provenance Xattrs From App Bundle
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          APP_DIR="${TARGET_BUILD_DIR}/${WRAPPER_NAME}"
          if [ ! -d "$APP_DIR" ]; then
            exit 0
          fi
          find "$APP_DIR" -type f ! -path '*/_CodeSignature/*' -print0 | while IFS= read -r -d '' f; do
            tmp="${f}.noxattr"
            ditto --norsrc --noextattr "$f" "$tmp"
            # Preserve executable bit for binaries/dylibs
            if [ -x "$f" ]; then chmod +x "$tmp"; fi
            mv -f "$tmp" "$f"
          done
    scheme:
      testTargets:
        - WildernessEdgeTests

  WildernessEdgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WildernessEdgeTests
      - path: WildernessEdge/Core/SafetyFilter.swift
      - path: WildernessEdge/Core/SpeechManager.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wildernessedge.app.tests
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

schemes:
  WildernessEdge:
    build:
      targets:
        WildernessEdge: all
        WildernessEdgeTests: [test]
    test:
      targets:
        - WildernessEdgeTests
      gatherCoverageData: false

  # CI / Simulator verification of Phase 1 filters without building/signing the app host.
  WildernessEdgeTests:
    build:
      targets:
        WildernessEdgeTests: all
    test:
      targets:
        - WildernessEdgeTests
      gatherCoverageData: false
