name: WildernessEdge
options:
  bundleIdPrefix: com.wildernessedge
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
packages:
  LiteRTLM:
    url: https://github.com/google-ai-edge/LiteRT-LM
    from: 0.12.0
targets:
  WildernessEdge:
    type: application
    platform: iOS
    dependencies:
      - package: LiteRTLM
        product: LiteRTLM
    sources:
      - path: WildernessEdge
        excludes:
          - Resources/**
          # Omit asset catalog on Simulator/ad-hoc builds: macOS stamps
          # com.apple.provenance on actool outputs, and codesign then treats
          # Assets.car / AppIcon PNGs as nested unsigned code objects.
          - Assets.xcassets/**
      - path: WildernessEdge/Resources
        type: folder
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wildernessedge.app
        PRODUCT_NAME: WildernessEdge
        INFOPLIST_FILE: WildernessEdge/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: WildernessEdge/App/WildernessEdge.entitlements
        GENERATE_INFOPLIST_FILE: false
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        ENABLE_DEBUG_DYLIB: NO
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
    scheme:
      testTargets:
        - WildernessEdgeTests

  WildernessEdgeTests:
    type: bundle.unit-test
    platform: iOS
    # The test target compiles individual Core sources rather than importing the app
    # module (the app target is not a test host), so every type under test must be
    # listed here explicitly. Fixtures under WildernessEdgeTests/ are picked up by the
    # directory source above and copied flat into the test bundle's resources, which is
    # what Bundle(for:).url(forResource:withExtension:) expects.
    sources:
      - path: WildernessEdgeTests
      - path: WildernessEdge/Core/SafetyFilter.swift
      - path: WildernessEdge/Core/SpeechManager.swift
      - path: WildernessEdge/Core/WordPieceTokenizer.swift
      - path: WildernessEdge/Core/TextEmbeddingManager.swift
      - path: WildernessEdge/Core/VectorRAGManager.swift
      # Embedder assets arrive with Pablo's Checkpoint 1 delivery. They are optional so the
      # project generates before they exist; once they land, re-running `xcodegen generate`
      # is all TextEmbeddingManagerTests needs to stop skipping. Listed individually rather
      # than as a folder so they land flat in the test bundle and the .mlpackage gets
      # compiled to .mlmodelc by Xcode's CoreML build rule.
      - path: WildernessEdge/Resources/query-embedder.mlpackage
        optional: true
        buildPhase: resources
      - path: WildernessEdge/Resources/query-embedder-vocab.txt
        optional: true
        buildPhase: resources
      - path: WildernessEdge/Resources/query-embedder-tokenizer.json
        optional: true
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wildernessedge.app.tests
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

schemes:
  WildernessEdge:
    build:
      targets:
        WildernessEdge: all
        WildernessEdgeTests: [test]
    test:
      targets:
        - WildernessEdgeTests
      gatherCoverageData: false

  # CI / Simulator verification of Phase 1 filters without building/signing the app host.
  WildernessEdgeTests:
    build:
      targets:
        WildernessEdgeTests: all
    test:
      targets:
        - WildernessEdgeTests
      gatherCoverageData: false
